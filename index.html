<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비바로체 마케팅 제작기</title>
<style>
:root{--ink:#20201d;--muted:#716f68;--line:#e9e5dc;--paper:#fbfaf7;--cream:#f3eee4;--gold:#a47b3f;--dark:#242622;--white:#fff}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif}
button,select{font:inherit}.wrap{max-width:1120px;margin:auto;padding:22px}.hero{background:linear-gradient(135deg,#262823,#41443c);color:#fff;border-radius:28px;padding:32px;display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:center;box-shadow:0 18px 50px #28291f1c}
.eyebrow{color:#d7bd8c;font-size:13px;font-weight:800;letter-spacing:.13em}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.06;margin:10px 0 14px}.hero p{margin:0;color:#e6e5df;line-height:1.7}
.product-img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:22px}
.grid{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 10px 30px #3936220a}
.panel h2{font-size:19px;margin:0 0 16px}.facts{display:grid;gap:12px}.fact{padding-bottom:12px;border-bottom:1px solid var(--line)}.fact:last-child{border:0}.fact small{display:block;color:var(--muted);margin-bottom:4px}.fact strong{font-size:15px}
label{display:block;font-size:13px;font-weight:800;margin:16px 0 7px}select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px}
.types{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.type{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;text-align:left;cursor:pointer}.type.active{border-color:var(--gold);background:#fbf6ec;color:#755525;font-weight:800}
.generate{width:100%;margin-top:18px;border:0;border-radius:14px;padding:15px;background:var(--dark);color:#fff;font-weight:900;cursor:pointer}
.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.copy{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer}
pre{white-space:pre-wrap;word-break:keep-all;margin:12px 0 0;min-height:390px;background:#f7f5f0;border-radius:16px;padding:18px;line-height:1.7;font-family:inherit;font-size:14px}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:12px}.badge{display:inline-block;padding:6px 10px;background:var(--cream);border-radius:999px;font-size:12px;font-weight:800;margin:3px 2px}
@media(max-width:760px){.wrap{padding:12px}.hero{grid-template-columns:1fr;padding:22px;border-radius:20px}.product-img{max-height:260px}.grid{grid-template-columns:1fr}.panel{padding:18px}.types{grid-template-columns:1fr 1fr}pre{min-height:320px}.hero h1{font-size:34px}}
</style>
</head>
<body>
<main class="wrap">
<section class="hero">
<div>
<div class="eyebrow">VIVANOCE · SINCE 1987</div>
<h1>비바로체<br>마케팅 제작기</h1>
<p>제품과 타깃을 고르면 이미지·영상 프롬프트부터 카드뉴스, 쇼츠, SNS 문구까지 한 번에 만듭니다.</p>
</div>
<img class="product-img" src="https://ecimg.cafe24img.com/pg1995b08809110011/vivanoce1987/web/product/big/20260625/842f068e28fa2ab089a2b812044bb0cc.png" alt="VA2502 클래식 컴포트 스니커즈">
</section>

<section class="grid">
<aside class="panel">
<h2>기본 제품</h2>
<div class="facts">
<div class="fact"><small>제품명</small><strong>VA2502 클래식 컴포트 스니커즈</strong></div>
<div class="fact"><small>판매가</small><strong>286,000원</strong></div>
<div class="fact"><small>소재</small><strong>천연 소가죽 · 국내 수제화</strong></div>
<div class="fact"><small>핵심 메시지</small><strong>깔끔한 배색과 압력 분산 구조를 더한 데일리 감각</strong></div>
</div>
<div style="margin-top:12px">
<span class="badge">화이트</span><span class="badge">블랙</span><span class="badge">블루</span><span class="badge">핑크</span><span class="badge">그레이</span>
</div>
<label for="target">광고 타깃</label>
<select id="target">
<option value="family">온 가족 데일리</option>
<option value="couple">부부·커플 함께 신기</option>
<option value="parents">부모님 선물</option>
<option value="standing">오래 서서 일하는 사람</option>
<option value="walking">걷기·여행을 즐기는 사람</option>
<option value="daily">편한 데일리화를 찾는 사람</option>
</select>
<label for="reference">광고 레퍼런스 스타일</label>
<select id="reference">
<option value="family">따뜻한 온 가족 감성</option>
<option value="gift">명절·생일 선물 캠페인</option>
<option value="walk">일상 속 함께 걷기</option>
<option value="tech">39년 기술·기능 설명</option>
<option value="home">집에서 신어보는 자연스러운 생활컷</option>
<option value="ugc">실제 사용 후기형 UGC</option>
<option value="fashion">감각적인 데일리 패션</option>
</select>
<label for="color">제품 색상</label>
<select id="color">
<option>화이트</option><option>블랙</option><option>블루</option><option>핑크</option><option>그레이</option>
</select>
<label>만들 콘텐츠</label>
<div class="types">
<button class="type active" data-type="all">전체 묶음</button>
<button class="type" data-type="image">이미지·영상</button>
<button class="type" data-type="cards">카드뉴스</button>
<button class="type" data-type="shorts">쇼츠 대본</button>
<button class="type" data-type="social">SNS 3종</button>
</div>
<button class="generate" id="generate">콘텐츠 만들기</button>
<p class="note">질병 치료·통증 개선을 단정하지 않고, 제품의 구조와 착화감을 중심으로 표현합니다.</p>
</aside>

<section class="panel">
<div class="result-head"><h2>생성 결과</h2><button class="copy" id="copy">전체 복사</button></div>
<pre id="result">왼쪽에서 타깃과 색상을 선택한 뒤
‘콘텐츠 만들기’를 눌러주세요.</pre>
</section>
</section>
</main>
<script>
let selectedType='all';
document.querySelectorAll('.type').forEach(btn=>btn.addEventListener('click',()=>{
 document.querySelectorAll('.type').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active'); selectedType=btn.dataset.type;
}));
const targets={
 family:{label:'온 가족 데일리',hook:'가족 신발, 이제 편안함과 스타일을 함께 고르세요.',scene:'20대 성인 자녀부터 50~60대 부모까지 다양한 연령의 한국인 가족이 밝은 주말 외출길에서 각자의 스타일에 맞게 신발을 신고 함께 걷는 자연스러운 장면'},
 couple:{label:'부부·커플 함께 신기',hook:'함께 걷는 시간이 많다면, 신발도 함께 편해야 하니까.',scene:'나이에 한정되지 않은 한국인 부부 또는 성인 커플이 가을 산책로에서 서로 다른 컬러의 스니커즈를 신고 자연스럽게 걷는 장면'},
 parents:{label:'부모님 선물',hook:'부모님께 매일 손이 가는 편안함을 선물하세요.',scene:'한국인 부모와 성인 자녀가 밝고 정돈된 거실에서 신발을 선물하고 함께 살펴보는 자연스러운 순간'},
 standing:{label:'오래 서서 일하는 사람',hook:'하루 종일 서 있는 발, 신발부터 달라야 합니다.',scene:'오래 서서 일한 한국인 직장인이 퇴근 후 편안한 표정으로 신발 끈을 정리하는 현실적인 실내 장면'},
 walking:{label:'걷기·여행을 즐기는 사람',hook:'많이 걷는 날일수록 신발 선택이 중요합니다.',scene:'햇살 좋은 산책로를 여유롭게 걷는 한국인 성인의 자연스러운 전신 장면'},
 daily:{label:'편한 데일리화를 찾는 사람',hook:'편한 신발은 예쁘기 어렵다는 생각, 바꿔보세요.',scene:'미니멀한 도심 카페 앞에서 캐주얼 의상에 스니커즈를 매치한 한국인 성인 모델'}
};
const references={
 family:{name:'따뜻한 온 가족 감성',direction:'여러 세대가 한 공간에서 자연스럽게 연결되는 따뜻한 가족 서사. 상품을 과하게 들이밀지 않고 함께 걷는 순간과 표정을 먼저 보여준다.',copy:'우리 가족의 매일이 조금 더 편안하도록'},
 gift:{name:'명절·생일 선물 캠페인',direction:'선물을 건네는 장면에서 시작해 실제 착용과 함께 걷는 장면으로 이어지는 감정 중심 구성. 마지막에 제품과 혜택을 명확히 제시한다.',copy:'마음을 전하는 가장 편안한 방법'},
 walk:{name:'일상 속 함께 걷기',direction:'집 앞 산책, 여행, 장보기처럼 누구나 공감하는 걷기 상황을 담는다. 세대와 성별이 다른 인물이 각자의 스타일로 같은 브랜드를 신는다.',copy:'함께 걷는 모든 순간에'},
 tech:{name:'39년 기술·기능 설명',direction:'천연 소가죽, 압력 분산 구조, 수제화 제작 경험을 제품 디테일 컷과 함께 차분하고 신뢰감 있게 설명한다.',copy:'39년이 만든 편안함의 차이'},
 home:{name:'집에서 신어보는 자연스러운 생활컷',direction:'밝은 한국의 집과 부드러운 창가 자연광 속에서 모델이 작은 의자에 편안히 앉아 신발을 신거나 끈과 착화 상태를 확인하는 순간을 담는다. 휴일의 담백한 일상복, 힘을 뺀 표정과 자세, 따뜻한 우드 포인트를 활용한다. 참고 이미지의 인물 얼굴·의상·신발 디자인·공간 배치는 복제하지 않는다.',copy:'집을 나서기 전부터 편안하게'},
 ugc:{name:'실제 사용 후기형 UGC',direction:'한국의 실제 집이나 현관에서 사용자가 휴대폰으로 직접 촬영한 듯한 자연스러운 후기 형식. 과장된 연기와 스튜디오 느낌을 피한다.',copy:'요즘 가장 자주 신는 신발'},
 fashion:{name:'감각적인 데일리 패션',direction:'기능성 신발의 전형적인 이미지를 벗어나 계절 코디와 색상 조합을 중심으로 세련되게 보여준다.',copy:'편안함도 스타일이 될 수 있으니까'}
};
function imageText(t,c,r){return `[광고 이미지 프롬프트]
첨부한 VA2502 제품 사진을 최종 이미지 속 신발의 절대적인 제품 기준으로 사용한다. 신발의 앞코, 가죽 패널, 절개선, 측면 타공 배열, 금속 아일렛, 뒤축 패널, 두꺼운 화이트 아웃솔, 스티치와 좌우 구조를 임의로 변경하지 않는다.

참고 광고 방향: ${r.name}. ${r.direction}
장면: ${t.scene}.
착용 제품: VA2502 ${c} 컬러.
캠페인 핵심 문구: “${r.copy}”
구도: 세로 4:5, 70~85mm 화각, 자연스러운 전신 또는 무릎 아래 중심, 신발이 선명하게 보이게 구성.
분위기: 한국의 현실적인 공간, 부드러운 자연광, 고급스럽고 담백한 라이프스타일 광고, 과한 보정과 인위적인 AI 질감 금지.
텍스트를 넣을 수 있도록 상단 중앙과 하단에 충분한 여백 확보.
제품 로고·혀 라벨·타공·색 배합을 새로 만들거나 왜곡하지 않는다.

[영상 프롬프트]
모델은 제자리에서 신발 끈을 정리한 뒤 두 걸음 천천히 걷는다. 카메라는 낮은 위치에서 신발을 부드럽게 따라간다. 발과 신발의 형태가 흔들리거나 바뀌지 않으며, 새로운 장식·끈·로고가 생기지 않는다. 6초, 세로 9:16, 자연스러운 실제 광고 영상.`}

function cardsText(t,c,r){return `[카드뉴스 5장 · 1080×1350]
레퍼런스 방향 — ${r.name}: ${r.direction}
1장 — ${r.copy}
보조 훅 — ${t.hook}
2장 — 발이 편하려면, 발을 받쳐주는 구조부터 살펴봐야 하니까.
3장 — 천연 소가죽의 유연함에 압력 분산을 고려한 구조를 더했습니다.
4장 — VA2502 ${c} / 단정한 배색, 일상에 자연스럽게 어울리는 디자인.
5장 — 신는 순간, 다릅니다. 39년이 만든 편안함 / 기능성 수제화 비바로체

디자인 기준: 상단 중앙 짧은 문구, 신발은 4장부터 정확한 제품 사진 기준으로 노출. 아이보리·웜그레이 배경, 촌스럽거나 병원 광고 같은 표현 금지.`}

function shortsText(t,c,r){return `[30초 쇼츠 대본]
광고 스타일: ${r.name}
0~3초
“${r.copy}”

3~8초
“매일 신는 신발일수록
발을 어떻게 받쳐주는지 봐야 합니다.”

8~15초
“VA2502는 천연 소가죽의 유연함과
압력 분산을 고려한 구조를 담았습니다.”

15~21초
“발을 편안하게 감싸면서
깔끔한 배색으로 옷에도 자연스럽게 어울리고요.”

21~26초
“오늘 선택한 컬러는 ${c}.
${t.label}을 위한 데일리 스니커즈.”

26~30초
“신는 순간, 다릅니다.
39년이 만든 편안함, 비바로체.”

화면 자막은 문장당 1~2줄, 제품명과 핵심 기능만 강조.`}

function socialText(t,c,r){return `[유튜브 쇼츠]
제목: ${r.copy} | VA2502
설명: 깔끔한 배색에 편안한 구조를 더한 비바로체 데일리 스니커즈. 오늘의 컬러는 ${c}입니다.
#비바로체 #기능성수제화 #부모님신발 #천연소가죽 #편한신발

[틱톡]
편안함만 보고 고른 신발 같지 않죠?
깔끔한 배색과 압력 분산 구조를 담은 VA2502 ${c} 🤍
#비바로체 #편한운동화 #온가족신발 #데일리신발 #수제화

[인스타 릴스]
편한 신발을 찾다 보면 디자인을 포기하게 될 때가 있잖아요.
VA2502는 매일 손이 가는 깔끔한 배색에, 발을 편안하게 받쳐주는 구조까지 담았어요.
${t.label}용 신발을 찾고 있다면 ${c} 컬러도 눈여겨보세요 :)
#비바로체 #기능성신발 #부모님선물 #천연가죽신발 #편한스니커즈`}
function build(){
 const t=targets[document.getElementById('target').value], r=references[document.getElementById('reference').value], c=document.getElementById('color').value;
 const parts={image:imageText(t,c,r),cards:cardsText(t,c,r),shorts:shortsText(t,c,r),social:socialText(t,c,r)};
 document.getElementById('result').textContent=selectedType==='all'?Object.values(parts).join('\n\n━━━━━━━━━━━━━━━━━━\n\n'):parts[selectedType];
}
document.getElementById('generate').addEventListener('click',build);
document.getElementById('copy').addEventListener('click',async()=>{
 await navigator.clipboard.writeText(document.getElementById('result').textContent);
 const b=document.getElementById('copy'); b.textContent='복사 완료'; setTimeout(()=>b.textContent='전체 복사',1400);
});
</script>
</body>
</html>
